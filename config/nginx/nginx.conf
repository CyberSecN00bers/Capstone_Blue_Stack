load_module modules/ngx_http_modsecurity_module.so;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Log Format ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # --- Kích hoạt ModSecurity ---
    modsecurity on;
    
    modsecurity_rules_file /etc/modsecurity.d/crs-setup.conf;
    modsecurity_rules_file /etc/modsecurity.d/rules/*.conf;


    # ---Backend (Upstream) ---
    # Đảm bảo tên service "dvwa" và "juice-shop" đúng với tên trong stack của bạn
    upstream dvwa_backend {
        server dvwa:80;
    }

    upstream juice_backend {
        server juice-shop:3000;
    }

    # --- Server Block: DVWA ---
    server {
        listen 80;
        server_name dvwa.localhost; 

        location / {
            proxy_pass http://dvwa_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # --- Server Block: JuiceShop ---
    server {
        listen 80;
        server_name juice.localhost;

        location / {
            proxy_pass http://juice_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # --- Server Block mặc định ---
    server {
        listen 80 default_server;
        return 403 "Forbidden: Unknown Host";
    }
}