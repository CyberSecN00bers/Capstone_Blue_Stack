load_module modules/ngx_http_modsecurity_module.so;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    ############################
    # MODSECURITY
    ############################
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.d/modsecurity.conf;
    modsecurity_rules_file /etc/nginx/modsecurity.d/modsecurity-override.conf;
    modsecurity_rules_file /etc/nginx/modsecurity.d/setup.conf;


    ############################
    # UPSTREAM
    ############################
    upstream dvwa_backend {
        server dvwa:80;
    }

    upstream juice_backend {
        server juice-shop:3000;
    }

    ############################
    # DVWA
    ############################
    server {
        listen 80;
        server_name dvwa.localhost;

        location / {
            proxy_pass http://dvwa_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    ############################
    # JUICESHOP
    ############################
    server {
        listen 80;
        server_name juice.localhost;

        location / {
            proxy_pass http://juice_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    ############################
    # DEFAULT
    ############################
    server {
        listen 80 default_server;
        return 403 "Forbidden: Unknown Host";
    }
}
