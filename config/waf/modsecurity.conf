# --- 1. Cấu hình Engine Cơ bản ---
SecRequestBodyAccess On
SecRequestBodyLimit 134217728
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject 

# Parser JSON/XML (Quan trọng)
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
  "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
  "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# --- 2. Cấu hình Audit Log (Cho Wazuh) ---
SecAuditEngine RelevantOnly 
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogFormat JSON
SecAuditLogType Serial
SecAuditLog /var/log/modsec/modsec_audit.log
SecAuditLogParts ABIFHZ

# --- 3. NẠP LUẬT OWASP CRS (Phần này thay thế logic copy file của script) ---
# Trong Docker Image owasp/modsecurity-crs, luật nằm ở /opt/owasp-crs/

# Nạp file setup (để nhận các biến PARANOIA, ANOMALY từ docker-compose)
Include /opt/owasp-crs/crs-setup.conf.example

# Nạp toàn bộ luật chặn tấn công
Include /opt/owasp-crs/rules/*.conf