# ./config/waf/nginx.conf
# File này sẽ được mount thành /etc/nginx/templates/nginx.conf.template

load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # --- ModSecurity Main Configuration ---
    # Bật ModSecurity Engine (Tùy chọn: có thể cấu hình trong modsecurity.conf)
    modsecurity on;
    
    # Tải file cấu hình ModSecurity chính mà chúng ta sẽ mount
    modsecurity_rules_file /etc/nginx/modsecurity.conf;
    
    # Cấu hình log (Path đã được mount ra Host)
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # --- Upstream Definitions ---
    # Sử dụng tên service từ Docker Compose
    upstream dvwa_backend {
        server dvwa:80;
    }

    upstream juice_backend {
        server juiceshop:3000;
    }

    # --- Server Block: Reverse Proxy ---
    server {
        listen 80;
        server_name dvwa.localhost juice.localhost; # Hỗ trợ nhiều tên miền

        # Thiết lập thời gian chờ
        client_max_body_size 100m;
        
        # --- Cấu hình cho DVWA (dvwa.localhost) ---
        location ~ ^/dvwa/|/(?:\?.*)?$ {
            # Tùy chỉnh nếu cần: if ($host ~* ^dvwa\.localhost$) { ... }
            proxy_pass http://dvwa_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Cấu hình cho JuiceShop (juice.localhost) ---
        location / {
            # Để đơn giản, route tất cả traffic không khớp với DVWA sang JuiceShop
            proxy_pass http://juice_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # --- Cấu hình Log ModSecurity (Audit Log) ---
        # Chỉ ghi log audit khi status code là lỗi hoặc bị chặn (5xx hoặc 4xx trừ 404)
        modsecurity_audit_log_relevant_status "^(?:5|4(?!04))";
        
        # Cấu hình để không ghi log các file tĩnh
        location ~* \.(jpg|jpeg|gif|png|css|js|ico|woff|woff2|ttf|eot)$ {
            modsecurity off;
        }
    }
    
    # --- Default Server (Chặn truy cập IP trực tiếp) ---
    server {
        listen 80 default_server;
        server_name _;
        return 444; # Connection closed without response
    }
}