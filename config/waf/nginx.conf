# --- 1. Load ModSecurity Module (Bắt buộc cho Nginx trong Docker này) ---
load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # --- CẤU HÌNH WAF TẠI ĐÂY ---
    modsecurity on;

    modsecurity_rules_file /etc/nginx/main.conf;
    
    # Cấu hình log
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # --- Upstream ---
    upstream dvwa_backend {
        server dvwa:80;
    }

    upstream juice_backend {
        server juiceshop:3000;
    }

    # --- Server Block ---
    server {
        listen 80;
        server_name dvwa.localhost juice.localhost; 
        client_max_body_size 100m;
        
        # DVWA
        location ~ ^/dvwa/|/(?:\?.*)?$ {
            proxy_pass http://dvwa_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # JuiceShop
        location / {
            proxy_pass http://juice_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # Chỉ ghi log audit khi status code là lỗi hoặc bị chặn
        modsecurity_audit_log_relevant_status "^(?:5|4(?!04))";
    }
    
    server {
        listen 80 default_server;
        return 444; 
    }
}